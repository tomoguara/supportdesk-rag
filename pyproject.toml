[project]
name = "supportdesk-rag"
version = "0.1.0"
description = "A RAG system for support desk tickets"
readme = "README.md"
authors = [
    { name = "Ton Oguara", email = "tomoguara@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=1.50.0",
    "pyyaml>=6.0.2",
    "tiktoken>=0.7.0",
    "transformers>=4.40.0",
    "langchain-text-splitters>=0.3.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.7.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.24.0",
    "sentence-transformers>=6.1.0",
]
[project.scripts]
sd-rag = "supportdesk_rag.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "python-dotenv>=1.0.0",
]
